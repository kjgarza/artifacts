name: Build and deploy

on:
  push:
    branches: [main]
    paths: ['inbox/**', '**/meta.json', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/build.test.mjs
      - run: node scripts/build.mjs
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Rebuild artifacts index [skip ci]"
          git push
      - name: Stage site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='.claude' --exclude='inbox' \
            --exclude='scripts' --exclude='_site' --exclude='*.md' --exclude='AGENTS.md' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
